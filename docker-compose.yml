# ============================================================
# bilibilipro docker-compose 编排 —— 常驻 cron 定时模式（长期运行）
#
# 容器以 restart: unless-stopped 常驻，由内置 cron 调度器按
# config/config.yaml 的 scheduler 段（enabled: true + cron 表达式）每日定时执行任务，容器崩溃会自动拉起。
#
# 首次部署步骤（完整说明见 docs/deploy.md）：
#   1. 准备配置：
#        mkdir -p config logs
#        cp config.example.yaml config/config.yaml
#      按需修改 config/config.yaml（scheduler 段 enabled: true + cron 时间、任务开关、钉钉推送等）
#   2. 构建镜像：
#        docker compose build
#   3. 扫码登录初始化 Cookie（交互式，二维码打印在终端）：
#        docker compose run --rm bilitool login
#      cookie 写入挂载卷 ./config/cookies.json，容器重建不丢
#   4. 验证配置与 Cookie：
#        docker compose run --rm bilitool test
#   5. 启动常驻（后台运行，按 cron 定时执行）：
#        docker compose up -d
#   6. 查看日志：
#        docker compose logs -f
#
# 更新 / 重启：
#   - 只改了 config/config.yaml：docker compose restart
#   - 升级镜像（代码或 Dockerfile 变更）：docker compose build && docker compose up -d
#
# 注意：
#   - 容器内以非 root（UID 10001）运行，宿主机挂载目录需可写：
#       chmod -R 777 config logs   （或 chown 10001:10001 config logs）
#   - 目录映射：./config -> /app/config（config.yaml + cookies.json）
#              ./logs    -> /app/logs（bilibilipro.log 结构化日志）
# ============================================================

services:
  bilitool:
    image: bilibilipro:latest
    container_name: bilibilipro
    # 常驻运行：容器崩溃/宿主机重启后自动拉起，保证长期运行
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/app/config    # 配置文件 + cookies.json 持久化（容器重建不丢）
      - ./logs:/app/logs        # 结构化日志持久化（bilibilipro.log）
    # command 只负责启动程序；任务执行时间由内置调度器决定，
    # 在 config/config.yaml 的 scheduler 段配置（enabled: true + cron 表达式，6 段含秒），
    # 修改后 docker compose restart 生效。
    command: ["daily"]
